syntax = "proto3";

package byteservice;

// Путь для генерации Go-кода
option go_package = "./byteservice";

// Описание сервиса
service ByteProcessor {
    rpc ProcessBytes (ProcessRequest) returns (ProcessResponse);
}

// Запрос содержит поле типа bytes
message ProcessRequest {
    bytes payload = 1; 
}

// Ответ возвращает обработанные байты и их размер
message ProcessResponse {
    bytes result = 1;
    int32 size = 2;
}